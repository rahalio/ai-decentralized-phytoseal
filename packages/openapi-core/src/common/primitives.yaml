openapi: 3.1.0
info:
  title: Shared primitives
  version: 0.1.0
  description: Prefixed IDs and money types shared across domains.
paths: {}
components:
  schemas:
    TenantId:
      type: string
      description: Prefixed ULID-style tenant identifier.
      pattern: '^tnt_[0-9A-HJKMNP-TV-Z]{26}$'
      example: tnt_01HZYXK8J0M0W5N6P7Q8R9S0T1U2
    UserId:
      type: string
      description: Prefixed ULID-style tenant operator user identifier.
      pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
      example: usr_01HZYXK8J0M0W5N6P7Q8R9S0T1U2
    Currency:
      type: string
      description: ISO 4217 currency code.
      minLength: 3
      maxLength: 3
      pattern: '^[A-Z]{3}$'
      example: USD
    Money:
      type: object
      description: Decimal-string amount + currency (never IEEE float).
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          description: Signed decimal string with up to 5 fractional digits.
          pattern: '^-?\d+(\.\d{1,5})?$'
          example: "1234.56"
        currency:
          $ref: '#/components/schemas/Currency'
    JobStatus:
      type: string
      description: Generic async job lifecycle.
      enum:
        - queued
        - running
        - done
        - failed
    PortPartyId:
      type: string
      description: Prefixed port-party id (`pty_…`).
      pattern: '^pty_[0-9A-HJKMNP-TV-Z]{26}$'
    DisclosurePolicyId:
      type: string
      description: Prefixed disclosure-policy id (`dpl_…`).
      pattern: '^dpl_[0-9A-HJKMNP-TV-Z]{26}$'
    CertificateId:
      type: string
      description: Prefixed certificate id (`crt_…`).
      pattern: '^crt_[0-9A-HJKMNP-TV-Z]{26}$'
    CertificateEventId:
      type: string
      description: Prefixed certificate-event id (`cev_…`).
      pattern: '^cev_[0-9A-HJKMNP-TV-Z]{26}$'
    AmendmentId:
      type: string
      description: Prefixed amendment id (`amd_…`).
      pattern: '^amd_[0-9A-HJKMNP-TV-Z]{26}$'
    ClassificationProposalId:
      type: string
      description: Prefixed classification-proposal id (`cls_…`).
      pattern: '^cls_[0-9A-HJKMNP-TV-Z]{26}$'
    KnowledgeAnnotationId:
      type: string
      description: Prefixed knowledge-annotation id (`kna_…`).
      pattern: '^kna_[0-9A-HJKMNP-TV-Z]{26}$'
    LegalHoldId:
      type: string
      description: Prefixed legal-hold id (`hld_…`).
      pattern: '^hld_[0-9A-HJKMNP-TV-Z]{26}$'
    EvidencePackId:
      type: string
      description: Prefixed evidence-pack id (`evd_…`).
      pattern: '^evd_[0-9A-HJKMNP-TV-Z]{26}$'
    MetricsReportId:
      type: string
      description: Prefixed cycle-time metrics report id (`mtr_…`).
      pattern: '^mtr_[0-9A-HJKMNP-TV-Z]{26}$'
