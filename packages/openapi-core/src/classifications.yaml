openapi: 3.1.0
info:
  title: Phytoseal Classifications API
  version: 0.1.0
  description: |
    AI HS/HTS (and ECCN) classification proposals with human broker review and
    knowledge annotations for master-data assist (BR-4).
  license:
    name: Proprietary
    url: https://phytoseal.local/license
  x-domain: cls
servers:
  - url: https://api.phytoseal.local
    description: Phytoseal API
security:
  - bearerAuth: []
  - apiKey: []

tags:
  - name: ClassificationProposals
    description: AI classification proposals and broker review
  - name: KnowledgeAnnotations
    description: Promotable broker knowledge annotations

paths:
  /v1/classification-proposals:
    get:
      operationId: listClassificationProposals
      tags: [ClassificationProposals]
      summary: List classification proposals
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ClassificationProposalStatus'
      responses:
        '200':
          description: Classification proposals page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationProposalListResponse'
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: createClassificationProposal
      tags: [ClassificationProposals]
      summary: Create an AI classification proposal
      security:
        - bearerAuth: []
        - apiKey: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassificationProposalCreateRequest'
      responses:
        '201':
          description: Proposal created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationProposalResponse'
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '409':
          $ref: ./common/responses.yaml#/components/responses/Conflict
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/classification-proposals/{proposalId}:
    get:
      operationId: getClassificationProposal
      tags: [ClassificationProposals]
      summary: Get a classification proposal
      security:
        - bearerAuth: []
      parameters:
        - name: proposalId
          in: path
          required: true
          schema:
            $ref: ./common/primitives.yaml#/components/schemas/ClassificationProposalId
      responses:
        '200':
          description: Classification proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationProposalResponse'
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/classification-proposals/{proposalId}/review:
    post:
      operationId: reviewClassificationProposal
      tags: [ClassificationProposals]
      summary: Record broker review of a classification proposal
      security:
        - bearerAuth: []
      parameters:
        - name: proposalId
          in: path
          required: true
          schema:
            $ref: ./common/primitives.yaml#/components/schemas/ClassificationProposalId
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BrokerReview'
      responses:
        '200':
          description: Review recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassificationProposalResponse'
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ./common/responses.yaml#/components/responses/Conflict
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/knowledge-annotations:
    get:
      operationId: listKnowledgeAnnotations
      tags: [KnowledgeAnnotations]
      summary: List knowledge annotations
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/Cursor
        - $ref: ./common/parameters.yaml#/components/parameters/Limit
        - name: promotedToPlaybook
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Knowledge annotations page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeAnnotationListResponse'
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem
    post:
      operationId: createKnowledgeAnnotation
      tags: [KnowledgeAnnotations]
      summary: Create a knowledge annotation
      security:
        - bearerAuth: []
      parameters:
        - $ref: ./common/parameters.yaml#/components/parameters/IdempotencyKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeAnnotationCreateRequest'
      responses:
        '201':
          description: Annotation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeAnnotationResponse'
        '400':
          $ref: ./common/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '409':
          $ref: ./common/responses.yaml#/components/responses/Conflict
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

  /v1/knowledge-annotations/{annotationId}:
    get:
      operationId: getKnowledgeAnnotation
      tags: [KnowledgeAnnotations]
      summary: Get a knowledge annotation
      security:
        - bearerAuth: []
      parameters:
        - name: annotationId
          in: path
          required: true
          schema:
            $ref: ./common/primitives.yaml#/components/schemas/KnowledgeAnnotationId
      responses:
        '200':
          description: Knowledge annotation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeAnnotationResponse'
        '401':
          $ref: ./common/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ./common/responses.yaml#/components/responses/NotFound
        default:
          $ref: ./common/responses.yaml#/components/responses/Problem

components:
  securitySchemes:
    apiKey:
      $ref: ./common/security.yaml#/components/securitySchemes/apiKey
    bearerAuth:
      $ref: ./common/security.yaml#/components/securitySchemes/bearerAuth

  schemas:
    ClassificationProposalStatus:
      type: string
      enum: [proposed, approved, overridden, rejected, deferred]
    BrokerReviewOutcome:
      type: string
      enum: [approved, overridden, rejected, deferred]

    ClassificationProposal:
      type: object
      required:
        - id
        - materialDescription
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: ./common/primitives.yaml#/components/schemas/ClassificationProposalId
        materialDescription:
          type: string
          minLength: 1
          maxLength: 4000
        materialNumber:
          type: string
          description: ERP / MDM material number when available.
        proposedHsCode:
          type: string
          description: AI-proposed HS/HTS code.
        proposedEccn:
          type: string
          description: AI-proposed ECCN when export-control assist is configured.
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        rationale:
          type: string
          maxLength: 8000
          description: Model rationale for the proposed codes.
        status:
          $ref: '#/components/schemas/ClassificationProposalStatus'
        finalHsCode:
          type: string
          description: Broker-confirmed HS/HTS after review.
        brokerAnnotation:
          type: string
          maxLength: 4000
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ClassificationProposalCreateRequest:
      type: object
      required: [materialDescription]
      properties:
        materialDescription:
          type: string
          minLength: 1
          maxLength: 4000
        materialNumber:
          type: string
        proposedHsCode:
          type: string
        proposedEccn:
          type: string
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1
        rationale:
          type: string
          maxLength: 8000

    BrokerReview:
      type: object
      required: [outcome]
      properties:
        outcome:
          $ref: '#/components/schemas/BrokerReviewOutcome'
        finalHsCode:
          type: string
          description: Required when outcome is overridden; optional otherwise.
        brokerAnnotation:
          type: string
          maxLength: 4000

    KnowledgeAnnotation:
      type: object
      required:
        - id
        - materialPattern
        - annotation
        - promotedToPlaybook
        - createdAt
      properties:
        id:
          $ref: ./common/primitives.yaml#/components/schemas/KnowledgeAnnotationId
        materialPattern:
          type: string
          minLength: 1
          maxLength: 500
          description: Pattern or keyword used to match future materials.
        annotation:
          type: string
          minLength: 1
          maxLength: 4000
        linkedProposalId:
          $ref: ./common/primitives.yaml#/components/schemas/ClassificationProposalId
        promotedToPlaybook:
          type: boolean
        createdAt:
          type: string
          format: date-time

    KnowledgeAnnotationCreateRequest:
      type: object
      required: [materialPattern, annotation]
      properties:
        materialPattern:
          type: string
          minLength: 1
          maxLength: 500
        annotation:
          type: string
          minLength: 1
          maxLength: 4000
        linkedProposalId:
          $ref: ./common/primitives.yaml#/components/schemas/ClassificationProposalId
        promotedToPlaybook:
          type: boolean
          default: false

    ClassificationProposalResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ClassificationProposal'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta

    ClassificationProposalListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ClassificationProposal'
        nextCursor:
          type: string

    ClassificationProposalListResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ClassificationProposalListData'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta

    KnowledgeAnnotationResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/KnowledgeAnnotation'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta

    KnowledgeAnnotationListData:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/KnowledgeAnnotation'
        nextCursor:
          type: string

    KnowledgeAnnotationListResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/KnowledgeAnnotationListData'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
